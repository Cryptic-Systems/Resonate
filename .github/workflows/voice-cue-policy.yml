name: Voice Cue Policy CI

on:
  push:
    branches: [resonate-voice-audit]
    paths:
      - "lib/services/voice_cue_router.dart"
      - "test/services/voice_cue_router_test.dart"
      - "test/services/voice_cue_manifest_test.dart"
      - ".github/workflows/voice-cue-policy.yml"
      - ".github/workflows/voice-cue-extract-assets.yml"
      - "tool/extract_resonate_voice_assets.py"
      - "pubspec.yaml"
      - "assets/audio/resonate_voice/voice_manifest.json"
      - "lib/screens/dj_console_screen.dart"
      - "lib/providers/music_provider_crossfade.dart"
      - "lib/providers/music_provider_media3.dart"
      - "lib/services/companion_command_executor.dart"
      - "lib/services/voice_cue_service.dart"
      - "lib/screens/voice_feedback_settings_screen.dart"
      - "lib/screens/settings_screen.dart"
      - "lib/providers/music_provider_dj_handoff.dart"
      - "lib/modes/providers/mode_provider.dart"
  pull_request:
    branches: [dj-workspace-development]
    paths:
      - "lib/services/voice_cue_router.dart"
      - "test/services/voice_cue_router_test.dart"
      - "test/services/voice_cue_manifest_test.dart"
      - ".github/workflows/voice-cue-policy.yml"
      - ".github/workflows/voice-cue-extract-assets.yml"
      - "tool/extract_resonate_voice_assets.py"
      - "pubspec.yaml"
      - "assets/audio/resonate_voice/voice_manifest.json"
      - "lib/screens/dj_console_screen.dart"
      - "lib/providers/music_provider_crossfade.dart"
      - "lib/providers/music_provider_media3.dart"
      - "lib/services/companion_command_executor.dart"
      - "lib/services/voice_cue_service.dart"
      - "lib/screens/voice_feedback_settings_screen.dart"
      - "lib/screens/settings_screen.dart"
      - "lib/providers/music_provider_dj_handoff.dart"
      - "lib/modes/providers/mode_provider.dart"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-cue-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voice-cue-policy:
    name: Analyze and test voice cue policy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze voice cue policy
        run: flutter analyze lib/services/voice_cue_router.dart lib/services/voice_cue_service.dart lib/providers/music_provider_media3.dart lib/providers/music_provider_crossfade.dart lib/providers/music_provider_dj_handoff.dart lib/modes/providers/mode_provider.dart lib/screens/dj_console_screen.dart lib/screens/settings_screen.dart lib/screens/voice_feedback_settings_screen.dart lib/services/companion_command_executor.dart test/services/voice_cue_router_test.dart test/services/voice_cue_manifest_test.dart

      - name: Run voice cue policy tests
        run: flutter test test/services/voice_cue_router_test.dart test/services/voice_cue_manifest_test.dart --reporter expanded
