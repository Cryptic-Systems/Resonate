name: Resonate CI

on:
  push:
    branches: [Resonate-True-Apk]
  pull_request:
    branches: [Resonate-True-Apk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resonate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate DSP, Flutter, and Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Patch just_audio DSP sink
        run: python3 scripts/patch_just_audio_dsp_sink.py

      - name: Verify just_audio DSP sink injection
        run: python3 scripts/patch_just_audio_dsp_sink.py --verify

      - name: Flutter analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Flutter tests
        run: flutter test --reporter expanded

      - name: Native DSP-ENGINE compile and integration smoke test
        working-directory: android/app/src/main/cpp
        run: |
          set -euo pipefail
          cmake -S third_party/DSP-ENGINE -B /tmp/resonate-dsp-build \
            -DDSP_BUILD_SHARED=OFF \
            -DDSP_BUILD_STATIC=ON \
            -DDSP_BUILD_TESTS=OFF \
            -DDSP_BUILD_EXAMPLES=OFF \
            -DDSP_BACKEND_AAUDIO=OFF \
            -DDSP_BACKEND_ALSA=OFF \
            -DDSP_BACKEND_COREAUDIO=OFF \
            -DDSP_BACKEND_WASAPI=OFF
          cmake --build /tmp/resonate-dsp-build --parallel 2
          g++ -std=c++17 -O2 \
            -Ithird_party/DSP-ENGINE/include \
            tests/dsp_engine_smoke.cpp \
            /tmp/resonate-dsp-build/libdsp_engine.a \
            -pthread -o /tmp/resonate-dsp-smoke
          /tmp/resonate-dsp-smoke

      - name: Android DSP unit tests
        working-directory: android
        run: ./gradlew app:testDebugUnitTest --no-daemon

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Verify release APK and enforce size budget
        env:
          APK_SIZE_LIMIT_MB: "100"
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          size_bytes="$(stat -c '%s' "$apk")"
          size_mb="$(awk -v bytes="$size_bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')"
          limit_bytes="$((APK_SIZE_LIMIT_MB * 1024 * 1024))"
          echo "Release APK size: ${size_mb} MiB (${size_bytes} bytes)"
          echo "Release APK budget: ${APK_SIZE_LIMIT_MB} MiB (${limit_bytes} bytes)"
          if [ "$size_bytes" -gt "$limit_bytes" ]; then
            echo "::error::Release APK is ${size_mb} MiB, exceeding the ${APK_SIZE_LIMIT_MB} MiB budget."
            exit 1
          fi
          ls -lh "$apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: resonate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
